services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartfarm_backend
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set (e.g. in .env)}
      # Keep data where earlier compose deployments stored it (./backend on the host).
      - DB_FILE=/app/digital_twin_db.json
      - USERS_FILE=/app/users_db.json
      - UPLOAD_DIR=/app/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    restart: unless-stopped
